<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘의 루틴 🐾</title>
<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --bg: #f5f7ff;
  --card: #ffffff;
  --border: #e0e7ff;
  --primary: #3730a3;
  --primary-light: #6366f1;
  --primary-bg: #eef2ff;
  --success: #059669;
  --success-bg: #d1fae5;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --accent: #f59e0b;
  --accent-bg: #fef3c7;
  --diamond: #0284c7;
  --diamond-bg: #e0f2fe;
  --text: #1e1b4b;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --shadow: 0 2px 8px rgba(55,48,163,0.08);
  --shadow-md: 0 4px 16px rgba(55,48,163,0.12);
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }

/* ===== SCREENS ===== */
.screen {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
}
.screen.active { display: flex; flex-direction: column; }
.screen-inner {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 100px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.card-sm {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

/* ===== BUTTONS ===== */
.btn-primary {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 24px;
  font-size: 1rem;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary:active { opacity: 0.85; transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-success {
  background: var(--success);
  color: white;
  border: none;
  border-radius: 14px;
  padding: 16px 24px;
  font-size: 1rem;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  position: relative;
}
.btn-success:active { opacity: 0.85; transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 18px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-ghost:active { background: var(--border); }

.btn-danger {
  background: var(--danger);
  color: white;
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-sm {
  padding: 8px 14px;
  font-size: 0.85rem;
  border-radius: 10px;
}

/* ===== XP BAR ===== */
.xp-bar-wrap { display: flex; flex-direction: column; gap: 4px; }
.xp-bar-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); }
.xp-track { background: var(--border); border-radius: 99px; height: 10px; overflow: hidden; }
.xp-fill { background: var(--primary); border-radius: 99px; height: 100%; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

/* ===== PET ANIMATIONS ===== */
@keyframes petFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes petBounce {
  0% { transform: scale(1) translateY(0); }
  20% { transform: scale(1.25) translateY(-18px); }
  40% { transform: scale(0.95) translateY(-6px); }
  60% { transform: scale(1.1) translateY(-10px); }
  80% { transform: scale(0.98) translateY(-2px); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes petDroop {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(4px) rotate(3deg); }
}
@keyframes checkPop {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes bigBounce {
  0%,100% { transform: scale(1) translateY(0); }
  30% { transform: scale(1.2) translateY(-20px); }
  60% { transform: scale(0.95) translateY(-8px); }
}

.pet-float { animation: petFloat 3s ease-in-out infinite; }
.pet-bounce { animation: petBounce 0.6s ease-out; }
.pet-droop { animation: petDroop 2s ease-in-out infinite; }
.pet-bigbounce { animation: bigBounce 0.8s ease-out infinite; }

/* ===== SPEECH BUBBLE ===== */
.speech-bubble {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  position: relative;
  box-shadow: var(--shadow);
  max-width: 240px;
  margin: 0 auto;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--border);
}
.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--card);
  z-index: 1;
}

/* ===== DIAMOND CHIP ===== */
.diamond-chip {
  background: var(--diamond-bg);
  color: var(--diamond);
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 99px;
  padding: 4px 12px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

/* ===== TASK CARD ===== */
.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-md);
  animation: slideUp 0.3s ease;
}
.task-emoji { font-size: 2.5rem; line-height: 1; }
.xp-badge {
  background: var(--success-bg);
  color: var(--success);
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 99px;
  padding: 4px 10px;
}

/* ===== COMPLETED TASKS ===== */
.task-done-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  opacity: 0.6;
}
.check-circle {
  width: 24px; height: 24px;
  background: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 0.75rem;
  flex-shrink: 0;
  animation: checkPop 0.3s ease;
}

/* ===== PROGRESS DOTS ===== */
.progress-dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s;
}
.dot.done { background: var(--primary); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  max-width: 480px;
  margin: 0 auto;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 8px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-muted);
  gap: 3px;
  transition: color 0.15s;
}
.nav-btn.active { color: var(--primary); }
.nav-btn span:first-child { font-size: 1.3rem; }

/* ===== ALERT CARD ===== */
.alert-card {
  background: var(--danger-bg);
  border: 1px solid #fca5a5;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--danger);
}

/* ===== TIME BADGE ===== */
.time-badge {
  background: var(--primary-bg);
  color: var(--primary);
  border-radius: 99px;
  padding: 6px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  display: inline-block;
  text-align: center;
}

/* ===== SECTION LABEL ===== */
.section-label {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* ===== PIN PAD ===== */
.pin-display {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 20px 0;
}
.pin-dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s;
}
.pin-dot.filled { background: var(--primary); }
.pin-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 280px;
  margin: 0 auto;
}
.pin-key {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: background 0.1s, transform 0.1s;
  text-align: center;
}
.pin-key:active { background: var(--primary-bg); transform: scale(0.95); }

/* ===== REWARD SHOP GRID ===== */
.reward-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.reward-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.reward-card .reward-emoji { font-size: 2.2rem; }
.reward-card .reward-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
.reward-card .reward-cost { font-size: 0.8rem; font-weight: 700; color: var(--diamond); }
.reward-card .btn-redeem {
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.8rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  width: 100%;
  transition: opacity 0.15s;
}
.reward-card .btn-redeem.can-afford { background: var(--primary); color: white; }
.reward-card .btn-redeem.cant-afford { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

/* ===== CONFETTI ===== */
.confetti-piece {
  position: fixed;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none;
  z-index: 999;
}

/* ===== PARENT DASHBOARD ===== */
.child-summary {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.child-summary:last-child { border-bottom: none; }

/* ===== TABS ===== */
.tab-bar {
  display: flex;
  background: var(--primary-bg);
  border-radius: 14px;
  padding: 4px;
  gap: 2px;
}
.tab-btn {
  flex: 1;
  padding: 9px 6px;
  border-radius: 10px;
  border: none;
  background: transparent;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.tab-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow); }

/* ===== PHOTO APPROVAL ===== */
.photo-approval {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.photo-thumb {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 10px;
}

/* ===== INPUT STYLES ===== */
.input-field {
  background: var(--primary-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.95rem;
  color: var(--text);
  width: 100%;
  transition: border-color 0.2s;
}
.input-field:focus { border-color: var(--primary); }

.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }

/* ===== TOGGLE ===== */
.toggle-wrap { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
.toggle {
  width: 44px; height: 24px;
  background: var(--border);
  border-radius: 99px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--primary); }
.toggle::after {
  content: '';
  width: 20px; height: 20px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 2px; left: 2px;
  transition: left 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle.on::after { left: 22px; }

/* ===== REACTION SCREEN ===== */
#screen-reaction {
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reaction-inner {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.reaction-pet { font-size: 6rem; animation: petBounce 0.6s ease-out infinite; }
.reaction-xp { font-size: 2.5rem; font-weight: 900; color: var(--success); animation: pulse 0.8s ease infinite; }

/* ===== LEVEL UP SCREEN ===== */
#screen-levelup {
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.levelup-inner {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 32px 24px;
}

/* ===== MISC ===== */
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.centered { text-align: center; }
.flex-row { display: flex; align-items: center; gap: 10px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.text-sm { font-size: 0.85rem; }
.text-xs { font-size: 0.75rem; }
.font-bold { font-weight: 700; }
.color-primary { color: var(--primary); }
.color-secondary { color: var(--text-secondary); }
.color-muted { color: var(--text-muted); }
.color-success { color: var(--success); }
.color-danger { color: var(--danger); }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.w-full { width: 100%; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============================================================
     SCREEN 1: WELCOME
     ============================================================ -->
<div id="screen-welcome" class="screen active">
  <div class="screen-inner">
    <div class="centered mt-12">
      <div style="font-size:0.85rem;font-weight:700;color:var(--text-muted);letter-spacing:0.05em;">오늘의 루틴 🐾</div>
      <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;">루틴을 지키고 펫을 키워요!</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;" id="profile-list">
      <!-- Rendered by JS -->
    </div>

    <div class="centered" style="margin-top:auto;padding-top:20px;">
      <button class="btn-ghost btn-sm" onclick="goParentPin()">🔒 부모 모드</button>
    </div>
  </div>
</div>

<!-- ============================================================
     SCREEN 2: CHILD HOME
     ============================================================ -->
<div id="screen-home" class="screen">
  <div class="screen-inner" style="padding-bottom:120px;">

    <!-- PET CARD -->
    <div class="card" style="text-align:center;position:relative;" id="pet-card">
      <!-- Diamond chip top-right -->
      <div style="position:absolute;top:16px;right:16px;" id="home-diamond-chip"></div>

      <div style="font-size:0.75rem;color:var(--text-muted);font-weight:600;margin-bottom:10px;" id="pet-owner-label"></div>

      <!-- Speech bubble -->
      <div class="speech-bubble" id="speech-bubble" style="margin-bottom:14px;">...</div>

      <!-- Pet emoji -->
      <div id="pet-emoji-big" style="font-size:6rem;line-height:1;display:block;cursor:pointer;" onclick="triggerPetPat()">🥚</div>

      <!-- Stage label -->
      <div style="margin-top:8px;font-size:0.8rem;font-weight:700;color:var(--text-secondary);" id="pet-stage-label"></div>

      <!-- XP bar -->
      <div class="xp-bar-wrap" style="margin-top:14px;">
        <div class="xp-bar-labels">
          <span id="home-level-label">LV.1</span>
          <span id="home-xp-label">0/100 XP</span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="home-xp-fill" style="width:0%"></div></div>
      </div>
    </div>

    <!-- TIME BADGE -->
    <div class="centered"><div class="time-badge" id="time-slot-badge">🌅 아침 루틴</div></div>

    <!-- TAEKWONDO ALERT (hidden by default) -->
    <div class="alert-card hidden" id="taekwondo-alert">
      <span>⏰</span>
      <span id="taekwondo-text">태권도 출발까지 1시간 30분!</span>
    </div>

    <!-- TASKS SECTION -->
    <div class="section-label" style="padding-left:4px;">오늘의 퀘스트</div>

    <!-- Current task -->
    <div id="current-task-area"></div>

    <!-- Progress -->
    <div class="flex-between" style="padding:0 4px;" id="progress-row">
      <div class="progress-dots" id="progress-dots"></div>
      <div class="text-sm color-muted" id="progress-text"></div>
    </div>

    <!-- Completed tasks -->
    <div style="display:flex;flex-direction:column;gap:8px;" id="done-tasks-list"></div>

    <!-- All done card -->
    <div class="card centered hidden" id="all-done-card" style="padding:32px 20px;">
      <div style="font-size:3rem;">🎉</div>
      <div style="font-size:1.1rem;font-weight:800;margin-top:12px;color:var(--primary);">오늘 퀘스트 모두 완료!</div>
      <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px;">정말 최고예요! 펫이 행복해해요 😊</div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('quest')" id="nav-quest">
      <span>⚔️</span><span>퀘스트</span>
    </button>
    <button class="nav-btn" onclick="switchTab('shop')" id="nav-shop">
      <span>💎</span><span>보상 상점</span>
    </button>
    <button class="nav-btn" onclick="goParentPin()" id="nav-parent">
      <span>🔒</span><span>부모</span>
    </button>
  </nav>
</div>

<!-- ============================================================
     SCREEN 2b: REWARD SHOP (child)
     ============================================================ -->
<div id="screen-shop" class="screen">
  <div class="screen-inner" style="padding-bottom:120px;">
    <div class="flex-between">
      <div style="font-size:1.2rem;font-weight:800;">보상 상점 💎</div>
      <div class="diamond-chip" id="shop-points-display">💎 0포인트</div>
    </div>

    <div class="reward-grid" id="shop-grid"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn" onclick="switchTab('quest')" id="snav-quest">
      <span>⚔️</span><span>퀘스트</span>
    </button>
    <button class="nav-btn active" onclick="switchTab('shop')" id="snav-shop">
      <span>💎</span><span>보상 상점</span>
    </button>
    <button class="nav-btn" onclick="goParentPin()" id="snav-parent">
      <span>🔒</span><span>부모</span>
    </button>
  </nav>
</div>

<!-- ============================================================
     SCREEN 3: TASK COMPLETE REACTION
     ============================================================ -->
<div id="screen-reaction" class="screen">
  <div class="reaction-inner">
    <div class="reaction-pet" id="reaction-pet">🥚</div>
    <div class="reaction-xp" id="reaction-xp">+30 XP!</div>

<script>
// =====================================================================
// DATA CONSTANTS
// =====================================================================
const DEFAULT_PIN = '1234';

const CHARACTER_TYPES = {
  chick:    { name:'병아리', stages:['🥚','🐣','🐥','🐤','🐔'] },
  cat:      { name:'고양이', stages:['🥚','🐣','🐱','🐈','😻'] },
  rabbit:   { name:'토끼',   stages:['🥚','🐣','🐰','🐇','👑🐰'] },
  dog:      { name:'강아지', stages:['🥚','🐣','🐶','🐕','🦮'] },
  hamster:  { name:'햄스터', stages:['🥚','🐣','🐹','🐭','👑🐹'] },
};

const STAGE_ADJECTIVES = ['귀여운','씩씩한','의젓한','최고의'];

const DEFAULT_CHILDREN = [
  { id:'c1', name:'세하',   characterType:'dog',     level:1, xp:0, points:0 },
  { id:'c2', name:'치호',   characterType:'chick',   level:1, xp:0, points:0 },
  { id:'c3', name:'치유',   characterType:'rabbit',  level:1, xp:0, points:0 },
];

const DEFAULT_TASKS = [
  { id:'t1',  name:'세수하기',    emoji:'🚿', xp:30, slot:'morning',    photo:true,  enabled:true },
  { id:'t2',  name:'양치하기',    emoji:'🦷', xp:30, slot:'morning',    photo:true,  enabled:true },
  { id:'t3',  name:'밥먹기',      emoji:'🍚', xp:20, slot:'morning',    photo:false, enabled:true },
  { id:'t4',  name:'가방챙기기',  emoji:'🎒', xp:20, slot:'morning',    photo:true,  enabled:true },
  { id:'t5',  name:'손씻기',      emoji:'🙌', xp:15, slot:'afterschool',photo:false, enabled:true },
  { id:'t6',  name:'간식먹기',    emoji:'🍎', xp:15, slot:'afterschool',photo:false, enabled:true },
  { id:'t7',  name:'온리원 공부', emoji:'💻', xp:50, slot:'afterschool',photo:true,  enabled:true, for:['c1'] },
  { id:'t8',  name:'구몬 공부',   emoji:'📝', xp:50, slot:'afterschool',photo:true,  enabled:true, for:['c2'] },
  { id:'t9',  name:'책 읽기',     emoji:'📖', xp:30, slot:'afterschool',photo:false, enabled:true },
  { id:'t10', name:'태권도준비',  emoji:'🥋', xp:20, slot:'afterschool',photo:false, enabled:true, for:['c1'] },
  { id:'t11', name:'저녁먹기',    emoji:'🍽️', xp:15, slot:'evening',    photo:false, enabled:true },
  { id:'t12', name:'샤워',        emoji:'🚿', xp:30, slot:'evening',    photo:true,  enabled:true },
  { id:'t13', name:'양치',        emoji:'🦷', xp:30, slot:'evening',    photo:true,  enabled:true },
];

const DEFAULT_REWARDS = [
  { id:'r1', name:'좋아하는 간식 선택', emoji:'🍫', cost:50 },
  { id:'r2', name:'원하는 음식 저녁',   emoji:'🍕', cost:100 },
  { id:'r3', name:'게임 30분 추가',     emoji:'🎮', cost:120 },
  { id:'r4', name:'영화 보기',          emoji:'🎬', cost:200 },
  { id:'r5', name:'용돈 500원',         emoji:'💰', cost:150 },
  { id:'r6', name:'특별 선물 (엄마선택)', emoji:'🎁', cost:500 },
];

// =====================================================================
// STATE
// =====================================================================
let settings = {};  // { pin, taekwondoTime, children }
let tasks = [];
let rewards = [];
let currentChildId = null;
let pendingPin = '';
let pinTarget = 'parent';  // 'parent'
let currentSettingsTab = 'children';

// =====================================================================
// STORAGE HELPERS
// =====================================================================
function saveSettings() {
  try { localStorage.setItem('routinepet_settings', JSON.stringify(settings)); } catch(e) {}
}
function saveTasks() {
  try { localStorage.setItem('routinepet_tasks', JSON.stringify(tasks)); } catch(e) {}
}
function saveRewards() {
  try { localStorage.setItem('routinepet_rewards', JSON.stringify(rewards)); } catch(e) {}
}

function todayKey() {
  const d = new Date();
  return `routinepet_log_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadLog() {
  try { return JSON.parse(localStorage.getItem(todayKey()) || '{}'); } catch(e) { return {}; }
}
function saveLog(log) {
  try { localStorage.setItem(todayKey(), JSON.stringify(log)); } catch(e) {}
}

function loadRedeems() {
  try { return JSON.parse(localStorage.getItem('routinepet_redeems') || '[]'); } catch(e) { return []; }
}
function saveRedeems(r) {
  try { localStorage.setItem('routinepet_redeems', JSON.stringify(r)); } catch(e) {}
}

// =====================================================================
// INIT
// =====================================================================
function init() {
  // Load or create settings
  try {
    const raw = localStorage.getItem('routinepet_settings');
    settings = raw ? JSON.parse(raw) : {};
  } catch(e) { settings = {}; }
  if (!settings.pin) settings.pin = DEFAULT_PIN;
  if (!settings.children) settings.children = JSON.parse(JSON.stringify(DEFAULT_CHILDREN));
  if (!settings.taekwondoTime) settings.taekwondoTime = '';

  // Load tasks
  try {
    const raw = localStorage.getItem('routinepet_tasks');
    tasks = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_TASKS));
  } catch(e) { tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS)); }

  // Load rewards
  try {
    const raw = localStorage.getItem('routinepet_rewards');
    rewards = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_REWARDS));
  } catch(e) { rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS)); }

  saveSettings();
  saveTasks();
  saveRewards();

  renderWelcome();
}

// =====================================================================
// SCREEN MANAGEMENT
// =====================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) { el.classList.add('active'); el.scrollTop = 0; }
}

// =====================================================================
// PET HELPERS
// =====================================================================
function getPetStageIndex(level) {
  if (level <= 2)  return 0;
  if (level <= 5)  return 1;
  if (level <= 10) return 2;
  if (level <= 15) return 3;
  return 4;
}

function getPetEmoji(child) {
  const char = CHARACTER_TYPES[child.characterType] || CHARACTER_TYPES.chick;
  return char.stages[getPetStageIndex(child.level)];
}

function getPetStageName(child) {
  const level = child.level;
  if (level <= 2) return '🥚 아직 알 속이에요';
  if (level <= 5) return '🐣 방금 태어났어요!';
  const char = CHARACTER_TYPES[child.characterType] || CHARACTER_TYPES.chick;
  const adj = STAGE_ADJECTIVES[Math.min(Math.floor((level - 6) / 4), 3)];
  return `${adj} ${char.name}`;
}

function xpNeeded(level) { return 100; }

// =====================================================================
// WELCOME SCREEN
// =====================================================================
function renderWelcome() {
  const log = loadLog();
  const el = document.getElementById('profile-list');
  const slottedTasks = getSlottedTasks();
  const allEnabled = slottedTasks.filter(t => t.enabled);

  el.innerHTML = settings.children.map(child => {
    const done = allEnabled.filter(t => {
      const entry = log[`${child.id}_${t.id}`];
      return entry && entry.done && (!t.photo || entry.approved);
    }).length;
    const total = allEnabled.length;
    const petEmoji = getPetEmoji(child);

    return `<button onclick="enterChild('${child.id}')" style="
      background:white;border:1px solid var(--border);border-radius:20px;
      padding:16px 20px;display:flex;align-items:center;gap:16px;
      box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer;
      transition:transform 0.1s,box-shadow 0.1s;
    " onmousedown="this.style.transform='scale(0.97)'" onmouseup="this.style.transform=''" ontouchstart="this.style.transform='scale(0.97)'" ontouchend="this.style.transform=''">
      <div style="font-size:2.8rem;line-height:1;">${petEmoji}</div>
      <div style="flex:1;">
        <div style="font-size:1rem;font-weight:800;color:var(--text);">${child.name}</div>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:3px;">LV.${child.level} · 오늘 ${done}/${total} 완료</div>
        <div style="margin-top:8px;"><div class="xp-track"><div class="xp-fill" style="width:${Math.min((child.xp/xpNeeded(child.level))*100,100)}%"></div></div></div>
      </div>
    </button>`;
  }).join('');
}

// =====================================================================
// ENTER CHILD VIEW
// =====================================================================
function enterChild(childId) {
  currentChildId = childId;
  renderHomeScreen();
  showScreen('screen-home');
}

function getChild() {
  return settings.children.find(c => c.id === currentChildId);
}

function getSlottedTasks() {
  const hour = new Date().getHours();
  // Return tasks for current time slot, or all if off-hours
  return tasks.filter(t => {
    if (!t.enabled) return true;
    return true; // Show all enabled tasks; filter by slot in getActiveSlot
  });
}

function getActiveSlot() {
  const hour = new Date().getHours();
  if (hour >= 6 && hour < 9) return 'morning';
  if (hour >= 17 && hour < 20) return 'afterschool';
  if (hour >= 20 && hour < 23) return 'evening';
  if (hour >= 9 && hour < 17) return 'morning'; // school hours → show morning
  return 'evening'; // late night default
}

function getSlotLabel(slot) {
  if (slot === 'morning') return '🌅 아침 루틴';
  if (slot === 'afterschool') return '🏫 하교 후';
  return '🌙 저녁 루틴';
}

function getTasksForSlot(slot) {
  const child = getChild();
  return tasks.filter(t => {
    if (!t.enabled || t.slot !== slot) return false;
    if (!t.for || t.for.length === 0) return true;
    return child && t.for.includes(child.id);
  });
}

function renderHomeScreen() {
  const child = getChild();
  if (!child) return;

  const log = loadLog();
  const slot = getActiveSlot();
  const slotTasks = getTasksForSlot(slot);

  // Diamond chip
  document.getElementById('home-diamond-chip').innerHTML =
    `<div class="diamond-chip">💎 ${child.points}포인트</div>`;

  // Pet owner
  document.getElementById('pet-owner-label').textContent = `${child.name}의 펫`;

  // XP bar
  const xp = child.xp;
  const needed = xpNeeded(child.level);
  const pct = Math.min((xp / needed) * 100, 100);
  document.getElementById('home-level-label').textContent = `LV.${child.level}`;
  document.getElementById('home-xp-label').textContent = `${xp}/${needed} XP`;
  document.getElementById('home-xp-fill').style.width = pct + '%';

  // Pet emoji + stage
  const petEmoji = getPetEmoji(child);
  document.getElementById('pet-stage-label').textContent = getPetStageName(child);

  // Pet emoji element
  const petEl = document.getElementById('pet-emoji-big');
  petEl.textContent = petEmoji;

  // Determine mood
  const doneTasks = slotTasks.filter(t => {
    const entry = log[`${child.id}_${t.id}`];
    return entry && entry.done && (!t.photo || entry.approved);
  });
  const totalCount = slotTasks.length;
  const doneCount = doneTasks.length;
  const pctDone = totalCount > 0 ? doneCount / totalCount : 0;

  let mood, moodClass, speechText;
  if (totalCount === 0 || doneCount === 0) {
    mood = 'sad'; moodClass = 'pet-droop';
    speechText = '오늘 아직 아무것도 안 했어요... 😢';
  } else if (pctDone < 0.5) {
    mood = 'normal'; moodClass = 'pet-float';
    speechText = '같이 더 해봐요! 🌟';
  } else if (pctDone < 1.0) {
    mood = 'happy'; moodClass = 'pet-float';
    speechText = '거의 다 왔어요! 💪';
  } else {
    mood = 'best'; moodClass = 'pet-bigbounce';
    speechText = '오늘도 최고예요! 🎉';
  }

  petEl.className = '';
  petEl.style.fontSize = '6rem';
  petEl.style.lineHeight = '1';
  petEl.style.display = 'block';
  petEl.style.cursor = 'pointer';
  petEl.classList.add(moodClass);

  document.getElementById('speech-bubble').textContent = speechText;

  // Time slot badge
  document.getElementById('time-slot-badge').textContent = getSlotLabel(slot);

  // Taekwondo alert
  renderTaekwondoAlert();

  // Tasks
  renderTasks(child, log, slot, slotTasks, doneCount, totalCount);
}

function renderTaekwondoAlert() {
  const alertEl = document.getElementById('taekwondo-alert');
  const time = settings.taekwondoTime;
  if (!time) { alertEl.classList.add('hidden'); return; }
  const [h, m] = time.split(':').map(Number);
  const now = new Date();
  const target = new Date();
  target.setHours(h, m, 0, 0);
  const diffMs = target - now;
  if (diffMs <= 0 || diffMs > 2 * 3600 * 1000) { alertEl.classList.add('hidden'); return; }
  const diffH = Math.floor(diffMs / 3600000);
  const diffM = Math.floor((diffMs % 3600000) / 60000);
  alertEl.classList.remove('hidden');
  document.getElementById('taekwondo-text').textContent =

function renderTasks(child, log, slot, slotTasks, doneCount, totalCount) {
  const currentArea = document.getElementById('current-task-area');
  const doneList = document.getElementById('done-tasks-list');
  const progressDots = document.getElementById('progress-dots');
  const progressText = document.getElementById('progress-text');
  const allDoneCard = document.getElementById('all-done-card');
  const progressRow = document.getElementById('progress-row');

  // Find current (first undone) task
  const pendingTasks = slotTasks.filter(t => {
    const entry = log[`${child.id}_${t.id}`];
    return !(entry && entry.done && (!t.photo || entry.approved));
  });
  const doneTasks = slotTasks.filter(t => {
    const entry = log[`${child.id}_${t.id}`];
    return entry && entry.done && (!t.photo || entry.approved);
  });

  // Progress dots
  progressDots.innerHTML = slotTasks.map(t => {
    const isDone = doneTasks.find(d => d.id === t.id);
    return `<div class="dot${isDone?' done':''}"></div>`;
  }).join('');
  progressText.textContent = `${doneCount}/${totalCount} 완료`;

  if (totalCount === 0) {
    currentArea.innerHTML = `<div class="card centered" style="padding:32px 20px;color:var(--text-secondary);">이 시간대에 퀘스트가 없어요</div>`;
    doneList.innerHTML = '';
    allDoneCard.classList.add('hidden');
    progressRow.classList.add('hidden');
    return;
  }

  progressRow.classList.remove('hidden');

  if (pendingTasks.length === 0) {
    currentArea.innerHTML = '';
    allDoneCard.classList.remove('hidden');
  } else {
    allDoneCard.classList.add('hidden');
    const task = pendingTasks[0];
    const entry = log[`${child.id}_${task.id}`] || {};
    const waitingPhoto = task.photo && entry.done && !entry.approved;

    let actionBtn = '';
    if (waitingPhoto) {
      actionBtn = `<div style="background:var(--accent-bg);border-radius:12px;padding:12px;text-align:center;font-size:0.85rem;font-weight:700;color:var(--accent);">📸 사진 승인 대기 중...</div>`;
    } else if (task.photo) {
      actionBtn = `<label class="btn-primary" style="position:relative;overflow:hidden;">
        📸 사진 찍기
        <input type="file" accept="image/*" capture="environment" style="position:absolute;width:100%;height:100%;top:0;left:0;opacity:0;cursor:pointer;" onchange="handlePhotoChange(event,'${child.id}','${task.id}',${task.xp})">
      </label>`;
    } else {
      actionBtn = `<button class="btn-success" onclick="completeTask('${child.id}','${task.id}',${task.xp})">✅ 완료!</button>`;
    }

    currentArea.innerHTML = `
      <div class="task-card">
        <div class="flex-between" style="margin-bottom:14px;">
          <div class="task-emoji">${task.emoji}</div>
          <div class="xp-badge">+${task.xp} XP</div>
        </div>
        <div style="font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:16px;">${task.name}</div>
        ${actionBtn}
      </div>`;
  }

  // Done tasks
  doneList.innerHTML = doneTasks.map(t => `
    <div class="task-done-item">
      <div class="check-circle">✓</div>
      <span style="font-size:1.2rem;">${t.emoji}</span>
      <span style="font-size:0.9rem;font-weight:600;color:var(--text-secondary);flex:1;">${t.name}</span>
      <span class="text-xs color-muted">+${t.xp} XP</span>
    </div>`).join('');

  // Also show tasks waiting for photo approval
  const waitingTasks = slotTasks.filter(t => {
    const entry = log[`${child.id}_${t.id}`];
    return t.photo && entry && entry.done && !entry.approved;
  });
  if (waitingTasks.length > 0 && pendingTasks.length > 0 && waitingTasks[0].id === pendingTasks[0].id) {
    // Already shown in current task area
  }
}

// =====================================================================
// TASK COMPLETION
// =====================================================================
function completeTask(childId, taskId, xp) {
  const log = loadLog();
  log[`${childId}_${taskId}`] = { done: true, approved: true, ts: Date.now() };
  saveLog(log);
  awardXP(childId, xp, taskId);
}

function awardXP(childId, xp, taskId) {
  const child = settings.children.find(c => c.id === childId);
  if (!child) return;

  const oldLevel = child.level;
  child.xp += xp;

  // Level up check
  let leveled = false;
  let evolved = false;
  const oldStage = getPetStageIndex(oldLevel);

  while (child.xp >= xpNeeded(child.level)) {
    child.xp -= xpNeeded(child.level);
    child.level += 1;
    leveled = true;
    // Bonus diamonds
    const bonus = child.level % 5 === 0 ? 50 : 20;
    child.points += bonus;
  }

  const newStage = getPetStageIndex(child.level);
  if (newStage > oldStage) evolved = true;

  saveSettings();

  // Animate pet
  const petEl = document.getElementById('pet-emoji-big');
  if (petEl) {
    petEl.className = 'pet-bounce';
    setTimeout(() => { petEl.className = 'pet-float'; }, 700);
  }

  // Show reaction
  showReactionScreen(child, xp, taskId, leveled, evolved, oldLevel);
}

function showReactionScreen(child, xp, taskId, leveled, evolved, oldLevel) {
  document.getElementById('reaction-pet').textContent = getPetEmoji(child);
  document.getElementById('reaction-xp').textContent = `+${xp} XP!`;
  document.getElementById('reaction-msg').textContent = `${child.name}의 펫이 기뻐해요! 🎉`;
  showScreen('screen-reaction');

  if (leveled) {
    setTimeout(() => showLevelUpScreen(child, oldLevel, evolved), 1500);
  } else {
    setTimeout(() => {
      renderHomeScreen();
      showScreen('screen-home');
    }, 1500);
  }
}

function showLevelUpScreen(child, oldLevel, evolved) {
  const oldEmoji = getEmojiForLevel(child, oldLevel);
  const newEmoji = getPetEmoji(child);
  document.getElementById('levelup-pet').textContent = newEmoji;

  if (evolved) {
    document.getElementById('levelup-evolution').textContent = `${oldEmoji} → ${newEmoji} 진화했어요! ✨`;
  } else {
    document.getElementById('levelup-evolution').textContent = '';
  }

  const bonus = child.level % 5 === 0 ? 50 : 20;
  document.getElementById('levelup-reward-text').textContent = `+${bonus} 💎 포인트 획득!`;
  document.getElementById('levelup-level-text').textContent = `LV.${child.level} 달성!`;

  spawnConfetti();
  showScreen('screen-levelup');
}

function getEmojiForLevel(child, level) {
  const char = CHARACTER_TYPES[child.characterType] || CHARACTER_TYPES.chick;
  return char.stages[getPetStageIndex(level)];
}

  renderHomeScreen();

// =====================================================================
// PHOTO HANDLING
// =====================================================================
function handlePhotoChange(event, childId, taskId, xp) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    // Compress to 400px
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 400;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxDim) { h = h*(maxDim/w); w = maxDim; } }
      else { if (h > maxDim) { w = w*(maxDim/h); h = maxDim; } }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

      // Save photo awaiting approval
      const log = loadLog();
      log[`${childId}_${taskId}`] = { done: true, approved: false, photo: dataUrl, ts: Date.now() };
      saveLog(log);
      renderHomeScreen();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPhotoApprovals(log) {
  const section = document.getElementById('photo-approval-section');
  const list = document.getElementById('photo-approval-list');
  const pending = [];

  settings.children.forEach(child => {
    tasks.forEach(task => {
      const entry = log[`${child.id}_${task.id}`];
      if (entry && entry.done && !entry.approved && entry.photo) {
        pending.push({ child, task, entry, key: `${child.id}_${task.id}` });
      }
    });
  });

  if (pending.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = pending.map(p => `
    <div class="photo-approval" style="margin-bottom:10px;">
      <div class="flex-between">
        <span style="font-weight:700;">${p.child.name} - ${p.task.emoji} ${p.task.name}</span>
        <span class="xp-badge">+${p.task.xp} XP</span>
      </div>
      <img class="photo-thumb" src="${p.entry.photo}" alt="task photo">
      <div style="display:flex;gap:8px;">
        <button class="btn-success btn-sm" style="flex:1;" onclick="approvePhoto('${p.key}',${p.task.xp},'${p.child.id}')">✅ 승인</button>
        <button class="btn-danger btn-sm" style="flex:1;" onclick="rejectPhoto('${p.key}')">🔄 다시해요</button>
      </div>
    </div>`).join('');
}

function approvePhoto(key, xp, childId) {
  const log = loadLog();
  if (log[key]) { log[key].approved = true; saveLog(log); }
  awardXPParent(childId, xp);
  renderParentDashboard();
}

function awardXPParent(childId, xp) {
  const child = settings.children.find(c => c.id === childId);
  if (!child) return;
  const oldLevel = child.level;
  child.xp += xp;
  while (child.xp >= xpNeeded(child.level)) {
    child.xp -= xpNeeded(child.level);
    child.level += 1;
    const bonus = child.level % 5 === 0 ? 50 : 20;
    child.points += bonus;
  }
  saveSettings();
}

function rejectPhoto(key) {
  const log = loadLog();
  if (log[key]) { delete log[key]; saveLog(log); }
  renderParentDashboard();
}

function renderRedeemList() {
  const section = document.getElementById('redeem-section');
  const list = document.getElementById('redeem-list');
  const redeems = loadRedeems().filter(r => !r.ack);

  if (redeems.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  list.innerHTML = redeems.map((r, i) => `
    <div class="card-sm flex-between" style="margin-bottom:8px;">
      <div>
        <div style="font-weight:700;">${r.childName}: ${r.rewardEmoji} ${r.rewardName}</div>
        <div class="text-xs color-muted">💎 ${r.cost}포인트 사용</div>
      </div>
      <button class="btn-primary btn-sm" style="width:auto;" onclick="ackRedeem(${i})">확인</button>
    </div>`).join('');
}

function ackRedeem(idx) {
  const redeems = loadRedeems();
  const pending = redeems.filter(r => !r.ack);
  if (pending[idx]) { pending[idx].ack = true; }
  // Merge back
  const all = redeems.map(r => {
    if (!r.ack) { const match = pending.find(p => p.ts === r.ts); return match || r; }
    return r;
  });
  saveRedeems(all);
  renderRedeemList();
}

}

function resetApp() {
  if (!confirm('정말 모든 데이터를 초기화할까요? 되돌릴 수 없어요.')) return;
  if (!confirm('마지막 확인: 진짜 초기화할까요?')) return;
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      if (localStorage.key(i).startsWith('routinepet_')) keys.push(localStorage.key(i));
    }
    keys.forEach(k => localStorage.removeItem(k));
  } catch(e) {}
  init();
  showScreen('screen-welcome');
  alert('초기화 완료!');
}

// =====================================================================
// CONFETTI
// =====================================================================
function spawnConfetti() {
  const colors = ['#3730a3','#6366f1','#f59e0b','#059669','#ec4899','#0284c7'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (Math.random() * 8 + 6) + 'px';
    el.style.height = (Math.random() * 8 + 6) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// =====================================================================
// BOOT
// =====================================================================
init();
</script>
