<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>퀘스트 용사단 ⚔️</title>
<style>
/* ===== CSS VARIABLES ===== */
:root {
  --bg: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  --card: rgba(255,255,255,0.07);
  --card-hover: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.12);
  --primary: #7c3aed;
  --primary-light: #a855f7;
  --accent: #f59e0b;
  --accent-light: #fbbf24;
  --success: #10b981;
  --success-light: #34d399;
  --danger: #ef4444;
  --danger-light: #f87171;
  --diamond: #38bdf8;
  --diamond-light: #7dd3fc;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --muted2: #64748b;
}
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; }
img { max-width: 100%; }

/* ===== SCREEN MANAGEMENT ===== */
.screen {
  display: none; position: fixed; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  background: var(--bg);
  -webkit-overflow-scrolling: touch;
}
.screen.active { display: flex; flex-direction: column; }
.screen-inner {
  width: 100%; max-width: 480px; margin: 0 auto;
  padding: 0 16px 100px; min-height: 100%;
  display: flex; flex-direction: column;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  30%       { transform: translateY(-18px) scale(1.15); }
  60%       { transform: translateY(-8px) scale(1.05); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(124,58,237,0.6)); }
  50%       { transform: scale(1.06); filter: drop-shadow(0 0 20px rgba(168,85,247,0.9)); }
}
@keyframes xpFlash {
  0%   { transform: scale(0.5) translateY(20px); opacity: 0; }
  40%  { transform: scale(1.3) translateY(-10px); opacity: 1; }
  70%  { transform: scale(1.0) translateY(0); }
  100% { transform: scale(1.0) translateY(0); opacity: 1; }
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes starPop {
  0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
  60%  { transform: scale(1.3) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes progressFill {
  from { width: 0; } to { width: var(--target-width); }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25%       { transform: rotate(-8deg); }
  75%       { transform: rotate(8deg); }
}

.anim-fadeinup { animation: fadeInUp 0.4s ease both; }
.anim-bounce   { animation: bounce 0.8s ease infinite; }
.anim-pulse    { animation: pulse 2.5s ease-in-out infinite; }

/* ===== TYPOGRAPHY ===== */
.title-xl  { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
.title-lg  { font-size: 1.5rem; font-weight: 700; }
.title-md  { font-size: 1.2rem; font-weight: 600; }
.body-md   { font-size: 1rem; }
.body-sm   { font-size: 0.875rem; }
.body-xs   { font-size: 0.75rem; }
.text-muted { color: var(--muted); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }
.text-danger  { color: var(--danger); }
.text-diamond { color: var(--diamond); }
.text-center  { text-align: center; }
.fw-bold { font-weight: 700; }

/* ===== CARD ===== */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 20px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card-sm { border-radius: 14px; padding: 14px; }
.card-tight { padding: 12px 14px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 24px; border-radius: 14px;
  font-size: 1rem; font-weight: 700; letter-spacing: 0.2px;
  transition: all 0.18s ease; position: relative; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-accent  { background: var(--accent); color: #1a1a1a; }
.btn-accent:hover { background: var(--accent-light); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: var(--success-light); }
.btn-danger  { background: var(--danger); color: #fff; }
.btn-danger:hover  { background: var(--danger-light); }
.btn-ghost   { background: var(--card); border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--card-hover); }
.btn-full    { width: 100%; }
.btn-sm      { padding: 10px 18px; font-size: 0.9rem; border-radius: 10px; }
.btn-disabled { background: var(--card); color: var(--muted2); pointer-events: none; border: 1px solid var(--border); }

/* ===== BADGE / CHIP ===== */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
}
.badge-primary  { background: rgba(124,58,237,0.3); color: var(--primary-light); }
.badge-accent   { background: rgba(245,158,11,0.3); color: var(--accent-light); }
.badge-success  { background: rgba(16,185,129,0.3); color: var(--success-light); }
.badge-diamond  { background: rgba(56,189,248,0.2); color: var(--diamond-light); }
.badge-muted    { background: rgba(148,163,184,0.15); color: var(--muted); }

/* ===== XP BAR ===== */
.xp-bar-wrap {
  background: rgba(255,255,255,0.08); border-radius: 99px;
  height: 14px; overflow: hidden; position: relative;
}
.xp-bar-fill {
  height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light), #c084fc);
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  position: relative;
}
.xp-bar-fill::after {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
  background: rgba(255,255,255,0.5);
  border-radius: 0 99px 99px 0;
  animation: pulse 1.5s ease-in-out infinite;
}

/* ===== CHARACTER DISPLAY ===== */
.char-display {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 24px;
}
.char-emoji-big {
  font-size: 80px; line-height: 1;
  animation: pulse 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 20px rgba(124,58,237,0.7));
  display: block; cursor: pointer;
}
.char-emoji-big:active { animation: bounce 0.8s ease; }
.char-stage-name { font-size: 1rem; color: var(--muted); font-weight: 600; }
.char-evolve-hint { font-size: 0.78rem; color: var(--primary-light); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(15,12,41,0.95); border-top: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 12px 8px; color: var(--muted2);
  font-size: 0.7rem; font-weight: 600; cursor: pointer;
  transition: color 0.2s; border: none; background: none;
}
.nav-btn.active { color: var(--primary-light); }
.nav-btn .nav-icon { font-size: 1.4rem; }

/* ===== CONFETTI ===== */
.confetti-container {
  position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden;
}
.confetti-piece {
  position: absolute; top: -20px; width: 10px; height: 10px;
  border-radius: 2px; animation: confettiFall linear forwards;
}

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  border: 1px solid var(--border); border-radius: 24px;
  padding: 28px; width: 100%; max-width: 360px;
  animation: fadeInUp 0.3s ease;
}

/* ===== MISC ===== */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.spacer-sm { height: 8px; }
.spacer-md { height: 16px; }
.spacer-lg { height: 24px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.col  { display: flex; flex-direction: column; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tag { padding: 6px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
.tag-morning    { background: rgba(245,158,11,0.2); color: var(--accent-light); }
.tag-afterschool { background: rgba(16,185,129,0.2); color: var(--success-light); }
.tag-evening    { background: rgba(124,58,237,0.2); color: var(--primary-light); }
.photo-thumb    { width: 100%; border-radius: 12px; object-fit: cover; max-height: 200px; }
input[type="range"] { width: 100%; accent-color: var(--primary); }
input[type="text"], input[type="number"], input[type="password"] {
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; color: var(--text);
  font-size: 1rem; width: 100%; outline: none;
}
input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus {
  border-color: var(--primary-light);
}
select {
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; color: var(--text);
  font-size: 1rem; width: 100%; outline: none; appearance: none;
}
textarea {
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; color: var(--text);
  font-size: 1rem; width: 100%; outline: none; resize: none;
}
label { display: block; font-size: 0.875rem; color: var(--muted); margin-bottom: 6px; }
.form-group { margin-bottom: 14px; }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.toggle {
  position: relative; width: 48px; height: 26px;
  background: var(--muted2); border-radius: 99px; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0;
}
.toggle.on { background: var(--primary); }
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: left 0.2s;
}
.toggle.on::after { left: 25px; }
.pin-dots { display: flex; gap: 16px; justify-content: center; margin: 24px 0; }
.pin-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--muted); background: transparent;
  transition: all 0.2s;
}
.pin-dot.filled { background: var(--primary-light); border-color: var(--primary-light); }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.numkey {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; font-size: 1.4rem; font-weight: 700; color: var(--text);
  text-align: center; cursor: pointer; transition: all 0.15s; user-select: none;
}
.numkey:active { transform: scale(0.92); background: var(--card-hover); }
.numkey.del { font-size: 1.1rem; }
.section-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.progress-dots { display: flex; gap: 8px; justify-content: center; padding: 8px 0; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--card-hover); border: 1.5px solid var(--border);
  transition: all 0.3s;
}
.progress-dot.done { background: var(--success); border-color: var(--success); }
.progress-dot.active { background: var(--primary-light); border-color: var(--primary-light); transform: scale(1.3); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.tab-btn {
  flex-shrink: 0; padding: 8px 16px; border-radius: 99px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer;
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  transition: all 0.2s;
}
.tab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.reward-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.reward-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; text-align: center;
}
.reward-icon { font-size: 2.5rem; }
.reward-name { font-size: 0.9rem; font-weight: 600; }
.reward-cost { font-size: 0.85rem; color: var(--diamond); font-weight: 700; }
.child-selector-row { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.child-chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 99px; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--card);
  transition: all 0.2s; font-size: 0.9rem; font-weight: 600;
}
.child-chip.active { border-color: var(--primary-light); background: rgba(124,58,237,0.2); }
.taekwondo-banner {
  background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(220,38,38,0.15));
  border: 1px solid rgba(239,68,68,0.4); border-radius: 16px;
  padding: 16px; display: flex; align-items: center; gap: 12px;
  animation: wiggle 0.5s ease 0s 3;
}
.streak-flame { font-size: 1.8rem; }

/* ===== WELCOME SCREEN SPECIFIC ===== */
#screen-welcome .screen-inner { justify-content: center; min-height: 100vh; padding-top: 60px; padding-bottom: 40px; }
.welcome-logo { font-size: 3.5rem; text-align: center; margin-bottom: 8px; }
.welcome-title { font-size: 2rem; font-weight: 900; text-align: center; background: linear-gradient(135deg, #c084fc, #f59e0b, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.welcome-sub { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 32px; }
.profile-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px; border-radius: 20px; width: 100%; cursor: pointer;
  background: var(--card); border: 1px solid var(--border);
  transition: all 0.2s; margin-bottom: 10px; text-align: left;
}
.profile-btn:active { transform: scale(0.98); background: var(--card-hover); }
.profile-emoji { font-size: 2.4rem; }
.profile-info { flex: 1; }
.profile-name { font-size: 1.1rem; font-weight: 700; }
.profile-level { font-size: 0.8rem; color: var(--muted); }
.parent-btn {
  margin-top: 20px; background: none; border: 1px solid var(--border);
  padding: 12px 20px; border-radius: 12px; color: var(--muted); font-size: 0.9rem;
  width: 100%; cursor: pointer; transition: all 0.2s;
}
.parent-btn:active { background: var(--card); }

/* ===== LEVEL UP SCREEN ===== */
#screen-levelup .screen-inner { align-items: center; justify-content: center; min-height: 100vh; }
.levelup-stars { display: flex; gap: 12px; margin-bottom: 16px; font-size: 2rem; }
.levelup-stars span { animation: starPop 0.5s ease both; }
.levelup-stars span:nth-child(2) { animation-delay: 0.15s; }
.levelup-stars span:nth-child(3) { animation-delay: 0.3s; }

/* ===== HEADER ===== */
.screen-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,12,41,0.85); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
  padding: 14px 16px; width: 100%; display: flex; align-items: center; gap: 10px;
  max-width: 480px; margin: 0 auto;
}
.back-btn {
  background: none; border: none; color: var(--text); font-size: 1.4rem;
  cursor: pointer; padding: 4px; line-height: 1; transition: opacity 0.2s;
}
.back-btn:active { opacity: 0.6; }
.header-title { font-size: 1.1rem; font-weight: 700; flex: 1; }

/* ===== PARENT SETTINGS SPECIFIC ===== */
.emoji-picker { display: flex; flex-wrap: wrap; gap: 10px; }
.emoji-opt {
  font-size: 1.8rem; padding: 8px; border-radius: 12px; cursor: pointer;
  border: 2px solid transparent; background: var(--card); transition: all 0.2s;
}
.emoji-opt.selected { border-color: var(--primary-light); background: rgba(124,58,237,0.2); }

/* ===== XP GAIN SCREEN ===== */
#screen-xpgain .screen-inner { align-items: center; justify-content: center; min-height: 100vh; }
.xp-gain-text {
  font-size: 5rem; font-weight: 900; color: var(--accent);
  text-shadow: 0 0 40px rgba(245,158,11,0.6);
  animation: xpFlash 0.8s ease both;
}

/* ===== TASK SCREEN ===== */
.task-icon-big { font-size: 60px; line-height: 1; display: block; text-align: center; margin-bottom: 12px; }

/* ===== PENDING PHOTO ===== */
.pending-photo-box { border-radius: 16px; overflow: hidden; }

/* ===== SCROLLBAR (hide) ===== */
::-webkit-scrollbar { display: none; }

/* ===== SAFE AREA ===== */
.safe-bottom { height: calc(env(safe-area-inset-bottom, 0px) + 8px); }
</style>
</head>
<body>

<!-- ======== SCREEN: WELCOME ======== -->
<div class="screen active" id="screen-welcome">
  <div class="screen-inner">
    <div class="welcome-logo">⚔️</div>
    <div class="welcome-title">퀘스트 용사단</div>
    <p class="welcome-sub">매일 미션을 완료하고 용사를 키워봐요!</p>
    <div id="welcome-profiles"></div>
    <button class="parent-btn" onclick="showParentPin()">🔒 엄마/아빠 모드</button>
  </div>
</div>

<!-- ======== SCREEN: HOME ======== -->
<div class="screen" id="screen-home">
  <div id="home-header" class="screen-header">
    <div style="flex:1;">
      <div id="home-child-name" class="title-md"></div>
      <div id="home-child-level" class="body-xs text-muted"></div>
    </div>
    <div id="home-points-chip" class="badge badge-diamond" style="cursor:pointer" onclick="showScreen('screen-shop'); renderShop();"></div>
  </div>
  <div class="screen-inner" style="padding-top:0;">
    <div class="spacer-md"></div>
    <!-- Taekwondo banner -->
    <div id="taekwondo-banner" class="taekwondo-banner" style="display:none; margin-bottom:12px;">
      <span>🥋</span>
      <div>
        <div class="fw-bold" style="font-size:0.95rem;">태권도 출발 시간이 다가오고 있어요!</div>
        <div id="taekwondo-countdown" class="body-sm text-muted"></div>
      </div>
    </div>
    <!-- Character display -->
    <div class="card char-display" id="home-char-card">
      <span id="home-char-emoji" class="char-emoji-big" onclick="charTap()">🥚</span>
      <div id="home-char-stage" class="char-stage-name"></div>
      <div id="home-char-hint" class="char-evolve-hint"></div>
      <!-- XP bar -->
      <div style="width:100%; margin-top:8px;">
        <div class="row-between" style="margin-bottom:6px;">
          <span id="xp-label" class="body-sm text-muted"></span>
          <span id="xp-numbers" class="body-sm fw-bold"></span>
        </div>
        <div class="xp-bar-wrap">
          <div id="xp-bar-fill" class="xp-bar-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="spacer-md"></div>
    <!-- Slot badge -->
    <div class="row-between" style="margin-bottom:12px;">
      <div id="home-slot-badge" class="tag"></div>
      <div id="home-progress-text" class="body-sm text-muted"></div>
    </div>
    <!-- Task list -->
    <div id="home-tasks"></div>
    <!-- All done state -->
    <div id="home-all-done" style="display:none; text-align:center; padding:32px 0;">
      <div style="font-size:3rem;">🎉</div>
      <div class="title-md" style="margin:12px 0 8px;">이 시간 퀘스트 완료!</div>
      <div class="body-sm text-muted">다음 퀘스트 시간까지 푹 쉬어요</div>
    </div>
    <div class="safe-bottom"></div>
  </div>

<script>
// ================================================================
// DATA DEFINITIONS
// ================================================================
const CHARACTERS = {
  dragon: {

    stages: [
      { minLv:1,  maxLv:3,  emoji:'🥚',      label:'아기' },

      { minLv:15, maxLv:999, emoji:'🐉',     label:'전설의' },
    ]
  },
  robot: {
    name: '로봇',
    stages: [
      { minLv:1,  maxLv:3,  emoji:'🔩',      label:'아기' },
      { minLv:4,  maxLv:6,  emoji:'🤖',      label:'어린' },
      { minLv:7,  maxLv:9,  emoji:'⚙️🤖',    label:'견습생' },
      { minLv:10, maxLv:14, emoji:'🦾',      label:'전사' },

  },
  cat: {

    stages: [
      { minLv:1,  maxLv:3,  emoji:'🐱',      label:'아기' },
      { minLv:4,  maxLv:6,  emoji:'😸',      label:'어린' },
      { minLv:7,  maxLv:9,  emoji:'🐈',      label:'견습생' },
      { minLv:10, maxLv:14, emoji:'🐈‍⬛',     label:'전사' },
      { minLv:15, maxLv:999, emoji:'👑🐱',   label:'전설의' },
    ]
  },
  rabbit: {
    name: '토끼',
    stages: [
      { minLv:1,  maxLv:3,  emoji:'🐰',      label:'아기' },
      { minLv:4,  maxLv:6,  emoji:'🐇',      label:'어린' },
      { minLv:7,  maxLv:9,  emoji:'🐇✨',    label:'견습생' },
      { minLv:10, maxLv:14, emoji:'🌙🐇',    label:'전사' },
      { minLv:15, maxLv:999, emoji:'🦸🐇',   label:'전설의' },
    ]
  },
  bear: {
    name: '곰',
    stages: [
      { minLv:1,  maxLv:3,  emoji:'🐻',      label:'아기' },
      { minLv:4,  maxLv:6,  emoji:'🐼',      label:'어린' },
      { minLv:7,  maxLv:9,  emoji:'🐻‍❄️',    label:'견습생' },
      { minLv:10, maxLv:14, emoji:'👑🐻',    label:'전사' },
      { minLv:15, maxLv:999, emoji:'🦁',     label:'전설의' },
    ]
  }
};

const CHAR_TYPES = Object.keys(CHARACTERS);

function getCharStage(type, level) {
  const c = CHARACTERS[type] || CHARACTERS.dragon;
  return c.stages.find(s => level >= s.minLv && level <= s.maxLv) || c.stages[c.stages.length - 1];
}
function getCharEmoji(type, level) { return getCharStage(type, level).emoji; }
function getCharStageName(type, level) {
  const s = getCharStage(type, level);
  const cname = CHARACTERS[type] ? CHARACTERS[type].name : '드래곤';
  if (s.label === '견습생' || s.label === '전사') return `${cname} ${s.label}`;
  if (s.label === '전설의') return `전설의 ${cname}`;
  return `${s.label} ${cname}`;
}
function getCharNextEvolveLevels(type, level) {
  const c = CHARACTERS[type] || CHARACTERS.dragon;
  for (let s of c.stages) {
    if (s.minLv > level) return s.minLv - level;
  }
  return null;
}

const DEFAULT_TASKS = [
  { id:'t1', name:'세수하기', icon:'🚿', xp:30, slot:'morning',     needsPhoto:true,  enabled:true, tip:'깨끗하게 세수하고 하루를 시작해요!' },
  { id:'t2', name:'양치하기', icon:'🦷', xp:30, slot:'morning',     needsPhoto:true,  enabled:true, tip:'치카치카 양치질!' },
  { id:'t3', name:'밥 먹기',  icon:'🍚', xp:20, slot:'morning',     needsPhoto:false, enabled:true, tip:'든든하게 아침밥을 먹어요!' },
  { id:'t4', name:'가방 챙기기', icon:'🎒', xp:20, slot:'morning',  needsPhoto:true,  enabled:true, tip:'필요한 준비물을 다 챙겼나요?' },
  { id:'t5', name:'손 씻기',  icon:'🙌', xp:15, slot:'afterschool', needsPhoto:false, enabled:true, tip:'학교에서 돌아오면 먼저 손 씻기!' },
  { id:'t6', name:'간식 먹기', icon:'🍎', xp:15, slot:'afterschool', needsPhoto:false, enabled:true, tip:'맛있는 간식으로 에너지 충전!' },
  { id:'t7', name:'오늘의 학습', icon:'📚', xp:50, slot:'afterschool', needsPhoto:true, enabled:true, tip:'오늘 배운 것을 복습해봐요!' },
  { id:'t8', name:'태권도 준비', icon:'🥋', xp:20, slot:'afterschool', needsPhoto:false, enabled:true, tip:'태권도 도복이랑 가방 챙겼나요?' },
  { id:'t9', name:'저녁 먹기',  icon:'🍽️', xp:15, slot:'evening',   needsPhoto:false, enabled:true, tip:'가족과 함께 맛있는 저녁!' },
  { id:'t10', name:'샤워하기', icon:'🚿', xp:30, slot:'evening',    needsPhoto:true,  enabled:true, tip:'하루 동안의 피로를 씻어내요!' },
  { id:'t11', name:'양치하기', icon:'🦷', xp:30, slot:'evening',    needsPhoto:true,  enabled:true, tip:'자기 전에 꼭 양치해요!' },
];

const DEFAULT_REWARDS = [
  { id:'r1', name:'편의점 간식', icon:'🏪', cost:50 },
  { id:'r2', name:'좋아하는 간식 선택', icon:'🍫', cost:80 },
  { id:'r3', name:'게임 30분 추가', icon:'🎮', cost:100 },
  { id:'r4', name:'영화 보기', icon:'🎬', cost:200 },
  { id:'r5', name:'원하는 저녁 선택', icon:'🍕', cost:150 },
  { id:'r6', name:'특별 선물 (엄마 선택)', icon:'🎁', cost:500 },
];

const DEFAULT_SETTINGS = {
  parentPin: '0000',
  taekwondoTime: '14:25',
  xpPerLevel: 100,
  pointsPerLevel: 20,
  milestoneBonus: 50,
  milestoneInterval: 5,
  children: [
    { id:'c1', name:'아들', characterType:'dragon', level:1, xp:0, points:0, color:'#7c3aed' },
    { id:'c2', name:'딸', characterType:'rabbit', level:1, xp:0, points:0, color:'#ec4899' },
  ]
};

// ================================================================
// STATE
// ================================================================
let state = {
  currentChildId: null,
  pinCallback: null,
  pendingPhotoTask: null,
  pendingPhotoData: null,
  settingsTab: 'children',
  levelUpData: null,
  xpGainData: null,
  editingChildId: null,
  editingRewardId: null,
};

// ================================================================
// STORAGE
// ================================================================
function loadSettings() {
  try {
    const raw = localStorage.getItem('quest_settings');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
}
function saveSettings(s) {
  try { localStorage.setItem('quest_settings', JSON.stringify(s)); } catch(e) {}
}
function loadTasks() {
  try {
    const raw = localStorage.getItem('quest_tasks');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TASKS));
}
function saveTasks(t) {
  try { localStorage.setItem('quest_tasks', JSON.stringify(t)); } catch(e) {}
}
function loadRewards() {
  try {
    const raw = localStorage.getItem('quest_rewards');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_REWARDS));
}
function saveRewards(r) {
  try { localStorage.setItem('quest_rewards', JSON.stringify(r)); } catch(e) {}
}
function todayKey() {
  const d = new Date();
  return `quest_log_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadTodayLog() {
  try {
    const raw = localStorage.getItem(todayKey());
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}
function saveTodayLog(log) {
  try { localStorage.setItem(todayKey(), JSON.stringify(log)); } catch(e) {}
}
function loadRedeems() {
  try {
    const raw = localStorage.getItem('quest_redeems');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}
function saveRedeems(r) {
  try { localStorage.setItem('quest_redeems', JSON.stringify(r)); } catch(e) {}
}
function loadPendingPhotos() {
  try {
    const raw = localStorage.getItem('quest_photos');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}
function savePendingPhotos(p) {
  try { localStorage.setItem('quest_photos', JSON.stringify(p)); } catch(e) {}
}
function getChild(id) {
  const s = loadSettings();
  return s.children.find(c => c.id === id);
}
function saveChild(child) {
  const s = loadSettings();
  const idx = s.children.findIndex(c => c.id === child.id);
  if (idx >= 0) s.children[idx] = child;
  saveSettings(s);
}

// ================================================================
// SCREEN MANAGEMENT
// ================================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) {
    el.classList.add('active');
    el.scrollTop = 0;
  }
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function showMsg(icon, text) {
  document.getElementById('modal-msg-icon').textContent = icon;
  document.getElementById('modal-msg-text').textContent = text;
  openModal('modal-msg');
}

// ================================================================
// WELCOME SCREEN
// ================================================================
function renderWelcome() {
  showScreen('screen-welcome');
  const s = loadSettings();
  const tasks = loadTasks();
  const log = loadTodayLog();
  const container = document.getElementById('welcome-profiles');
  container.innerHTML = '';
  s.children.forEach(child => {
    const emoji = getCharEmoji(child.characterType, child.level);
    const stageName = getCharStageName(child.characterType, child.level);
    const childTasks = tasks.filter(t => t.enabled);
    const done = childTasks.filter(t => log[child.id] && log[child.id][t.id]).length;
    const btn = document.createElement('button');
    btn.className = 'profile-btn anim-fadeinup';
    btn.innerHTML = `
      <span class="profile-emoji">${emoji}</span>
      <div class="profile-info">
        <div class="profile-name">${esc(child.name)}</div>
        <div class="profile-level">${stageName} · 오늘 ${done}/${childTasks.length} 완료</div>
      </div>
      <span class="badge badge-primary">LV.${child.level}</span>
    `;
    btn.onclick = () => { state.currentChildId = child.id; renderHome(); showScreen('screen-home'); };
    container.appendChild(btn);
  });
}

// ================================================================
// HOME SCREEN
// ================================================================
function getCurrentSlot() {
  const h = new Date().getHours();
  if (h < 12) return 'morning';
  if (h < 18) return 'afterschool';
  return 'evening';
}
const SLOT_LABELS = { morning:'🌅 아침', afterschool:'🏫 하교 후', evening:'🌙 저녁' };
const SLOT_TAG_CLASS = { morning:'tag-morning', afterschool:'tag-afterschool', evening:'tag-evening' };

function renderHome() {
  const child = getChild(state.currentChildId);
  if (!child) { renderWelcome(); return; }
  const s = loadSettings();
  const tasks = loadTasks();
  const log = loadTodayLog();
  const slot = getCurrentSlot();

  // Header
  document.getElementById('home-child-name').textContent = child.name;
  document.getElementById('home-child-level').textContent = `LV.${child.level} · ${getCharStageName(child.characterType, child.level)}`;
  document.getElementById('home-points-chip').textContent = `💎 ${child.points}`;

  // Character
  document.getElementById('home-char-emoji').textContent = getCharEmoji(child.characterType, child.level);
  document.getElementById('home-char-stage').textContent = getCharStageName(child.characterType, child.level);
  const nextEvolveLevels = getCharNextEvolveLevels(child.characterType, child.level);
  document.getElementById('home-char-hint').textContent = nextEvolveLevels
    ? `✨ 다음 단계까지 ${nextEvolveLevels}레벨`
    : '🏆 최강 용사!';

  // XP bar
  const xpNeeded = s.xpPerLevel || 100;
  const xpPct = Math.min(100, Math.round((child.xp / xpNeeded) * 100));
  document.getElementById('xp-label').textContent = `LV.${child.level} → LV.${child.level+1}`;
  document.getElementById('xp-numbers').textContent = `${child.xp}/${xpNeeded} XP`;
  document.getElementById('xp-bar-fill').style.width = xpPct + '%';

  // Taekwondo banner
  checkTaekwondo(s);

  // Slot badge
  document.getElementById('home-slot-badge').className = `tag ${SLOT_TAG_CLASS[slot]}`;
  document.getElementById('home-slot-badge').textContent = SLOT_LABELS[slot];

  // Tasks for this slot
  const slotTasks = tasks.filter(t => t.enabled && t.slot === slot);
  const childLog = log[child.id] || {};
  const doneTasks = slotTasks.filter(t => childLog[t.id]);
  const pendingTasks = slotTasks.filter(t => !childLog[t.id]);

  document.getElementById('home-progress-text').textContent = `${doneTasks.length}/${slotTasks.length} 완료`;

  const container = document.getElementById('home-tasks');
  const allDoneEl = document.getElementById('home-all-done');

  if (pendingTasks.length === 0) {
    container.innerHTML = '';
    allDoneEl.style.display = 'block';
    // Show completed tasks summary
    if (slotTasks.length > 0) {
      const summary = document.createElement('div');
      summary.className = 'card card-sm';
      summary.style.marginTop = '16px';
      summary.innerHTML = `<div class="section-title" style="margin-bottom:10px;">완료한 퀘스트</div>` +
        slotTasks.map(t => `
          <div class="row" style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
            <span style="font-size:1.4rem;">${t.icon}</span>
            <span style="flex:1;">${esc(t.name)}</span>
            <span class="badge badge-success">✓ +${t.xp}XP</span>
          </div>
        `).join('');
      container.appendChild(summary);
    }
  } else {
    allDoneEl.style.display = 'none';
    container.innerHTML = '';

    // Progress dots
    const dotsWrap = document.createElement('div');
    dotsWrap.className = 'progress-dots';
    slotTasks.forEach((t, i) => {
      const dot = document.createElement('div');
      const isDone = !!childLog[t.id];
      const isNext = !isDone && slotTasks.slice(0, i).every(tt => childLog[tt.id]);
      dot.className = 'progress-dot' + (isDone ? ' done' : '') + (isNext ? ' active' : '');
      dotsWrap.appendChild(dot);
    });
    container.appendChild(dotsWrap);

    // Show pending tasks
    pendingTasks.forEach((task, idx) => {
      const card = buildTaskCard(task, idx === 0);
      container.appendChild(card);
    });

    // Show already-done tasks collapsed
    if (doneTasks.length > 0) {
      const doneWrap = document.createElement('div');
      doneWrap.innerHTML = `<div class="section-title" style="margin:16px 0 8px;">완료 ✓</div>`;
      doneTasks.forEach(t => {
        const row = document.createElement('div');
        row.className = 'card card-tight row-between';
        row.style.marginBottom = '8px';
        row.style.opacity = '0.6';
        row.innerHTML = `
          <div class="row" style="gap:10px;">
            <span style="font-size:1.4rem;">${t.icon}</span>
            <span class="body-md fw-bold">${esc(t.name)}</span>
          </div>
          <span class="badge badge-success">✓ +${t.xp}XP</span>
        `;
        doneWrap.appendChild(row);
      });
      container.appendChild(doneWrap);
    }
  }
}

function buildTaskCard(task, isFirst) {
  const card = document.createElement('div');
  card.className = 'card anim-fadeinup';
  card.style.marginBottom = '12px';
  if (!isFirst) card.style.opacity = '0.55';

  let actionBtn = '';
  if (task.needsPhoto) {
    actionBtn = `<label class="btn btn-accent btn-full" style="position:relative;overflow:hidden;cursor:pointer;">
      📸 사진 찍기
      <input type="file" accept="image/*" capture="environment"
        style="position:absolute;width:0;height:0;opacity:0;left:0;top:0;"
        onchange="handlePhotoChange(event,'${task.id}')">
    </label>`;
  } else {
    actionBtn = `<button class="btn btn-success btn-full" onclick="completeTask('${task.id}',${task.xp})">✅ 완료!</button>`;
  }

  card.innerHTML = `
    <span class="task-icon-big">${task.icon}</span>
    <div class="fw-bold text-center" style="font-size:1.3rem; margin-bottom:6px;">${esc(task.name)}</div>

    <div class="badge badge-accent" style="margin:0 auto 16px; display:table;">+${task.xp} XP</div>

  `;

}

function checkTaekwondo(s) {
  const banner = document.getElementById('taekwondo-banner');
  const countdown = document.getElementById('taekwondo-countdown');
  if (!s.taekwondoTime) { banner.style.display = 'none'; return; }
  const now = new Date();
  const [th, tm] = s.taekwondoTime.split(':').map(Number);
  const dep = new Date(now.getFullYear(), now.getMonth(), now.getDate(), th, tm);
  const diffMs = dep - now;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin >= 0 && diffMin <= 120) {
    banner.style.display = 'flex';
    if (diffMin === 0) countdown.textContent = '지금 출발하세요! 🏃';
    else countdown.textContent = `${diffMin}분 후 출발 (${s.taekwondoTime})`;
  } else {
    banner.style.display = 'none';
  }
}

// ================================================================
// TASK COMPLETION
// ================================================================
function completeTask(taskId, xp) {
  const child = getChild(state.currentChildId);
  if (!child) return;
  const log = loadTodayLog();
  if (!log[child.id]) log[child.id] = {};
  if (log[child.id][taskId]) return; // already done
  log[child.id][taskId] = { completedAt: Date.now(), xp };
  saveTodayLog(log);
  showXpGain(xp, taskId);
}

function handlePhotoChange(event, taskId) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 400;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxDim) { h = h * maxDim/w; w = maxDim; } }
      else        { if (h > maxDim) { w = w * maxDim/h; h = maxDim; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const tasks = loadTasks();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      state.pendingPhotoTask = task;
      state.pendingPhotoData = dataUrl;

      // Save pending photo
      const photos = loadPendingPhotos();
      photos.push({
        id: 'ph_' + Date.now(),
        childId: state.currentChildId,
        taskId: task.id,
        taskName: task.name,
        taskIcon: task.icon,
        taskXp: task.xp,
        photo: dataUrl,
        submittedAt: Date.now()
      });
      savePendingPhotos(photos);

      // Show pending screen
      const imgEl = document.getElementById('photopending-img-wrap');
      imgEl.innerHTML = `<img class="photo-thumb" src="${dataUrl}" alt="제출 사진">`;
      showScreen('screen-photopending');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showXpGain(xp, taskId) {
  const child = getChild(state.currentChildId);
  if (!child) return;
  document.getElementById('xpgain-char').textContent = getCharEmoji(child.characterType, child.level);
  document.getElementById('xpgain-text').textContent = '+' + xp + ' XP!';
  showScreen('screen-xpgain');
  setTimeout(() => {
    applyXp(xp);
  }, 1500);
}

function applyXp(xp) {
  const s = loadSettings();
  const child = getChild(state.currentChildId);
  if (!child) return;
  const xpPerLevel = s.xpPerLevel || 100;
  const oldLevel = child.level;
  child.xp += xp;
  let leveled = false;
  while (child.xp >= xpPerLevel) {
    child.xp -= xpPerLevel;
    child.level += 1;
    leveled = true;
    // Award points on level up
    let pts = s.pointsPerLevel || 20;
    let milestoneMsg = null;
    if (child.level % (s.milestoneInterval || 5) === 0) {
      pts += (s.milestoneBonus || 50);
      milestoneMsg = `+${s.milestoneBonus || 50} 💎 보너스!`;
    }
    child.points += pts;
    state.levelUpData = {
      oldLevel,
      newLevel: child.level,
      charType: child.characterType,
      pointsGained: pts,
      milestoneMsg,
      oldEmoji: getCharEmoji(child.characterType, oldLevel),
      newEmoji: getCharEmoji(child.characterType, child.level),
      newStageName: getCharStageName(child.characterType, child.level),
      evolved: getCharEmoji(child.characterType, oldLevel) !== getCharEmoji(child.characterType, child.level),
    };
  }
  saveChild(child);
  if (leveled) {
    showLevelUp();
  } else {
    renderHome();
    showScreen('screen-home');
  }
}

function renderShop() {

  document.getElementById('shop-points-badge').textContent = `💎 ${child.points}`;

    container.innerHTML = `<div class="card text-center" style="padding:40px 20px;">
      <div style="font-size:2.5rem; margin-bottom:12px;">🏪</div>
      <div class="title-md">보상이 없어요</div>
      <div class="body-sm text-muted" style="margin-top:6px;">엄마/아빠가 보상을 설정해요!</div>
    </div>`;
    return;
  }

  grid.className = 'reward-grid';
  rewards.forEach(r => {

    const card = document.createElement('div');

      <div class="reward-name">${esc(r.name)}</div>

        ${canAfford ? '교환하기' : '포인트 부족'}
      </button>
    `;

  container.appendChild(grid);

function confirmRedeem(rewardId) {
  const rewards = loadRewards();
  const r = rewards.find(x => x.id === rewardId);
  if (!r) return;
  document.getElementById('modal-redeem-icon').textContent = r.icon;
  document.getElementById('modal-redeem-name').textContent = r.name;
  document.getElementById('modal-redeem-cost').textContent = `💎 ${r.cost} 포인트`;
  document.getElementById('modal-redeem-confirm').onclick = () => { closeModal('modal-redeem'); executeRedeem(rewardId); };
  openModal('modal-redeem');
}

function executeRedeem(rewardId) {
  const child = getChild(state.currentChildId);
  if (!child) return;
  const rewards = loadRewards();
  const r = rewards.find(x => x.id === rewardId);
  if (!r) return;
  if (child.points < r.cost) { showMsg('😅', '포인트가 부족해요!'); return; }
  child.points -= r.cost;
  saveChild(child);
  // Log redemption
  const redeems = loadRedeems();
  redeems.push({
    id: 'rd_' + Date.now(),
    childId: child.id,
    childName: child.name,
    rewardId: r.id,
    rewardName: r.name,
    rewardIcon: r.icon,
    cost: r.cost,
    redeemedAt: Date.now(),
    acknowledged: false
  });
  saveRedeems(redeems);
  // Show success screen
  document.getElementById('redeem-icon').textContent = r.icon;
  document.getElementById('redeem-name').textContent = r.name;
  document.getElementById('redeem-cost').textContent = `-${r.cost} 💎`;
  document.getElementById('redeem-remaining').textContent = `남은 포인트: 💎 ${child.points}`;
  showScreen('screen-redeem');
}

  pinBuffer += d;

    setTimeout(checkPin, 200);
  }

function pinBack() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
}
function pinCancel() {
  pinBuffer = '';
  renderWelcome();
  showScreen('screen-welcome');
}
function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('pd'+i).classList.toggle('filled', i < pinBuffer.length);
  }
}
function checkPin() {
  const s = loadSettings();
  if (pinBuffer === (s.parentPin || '0000')) {
    pinBuffer = '';
    if (state.pinCallback) {
      state.pinCallback();
      state.pinCallback = null;
    } else {
      renderDashboard();
      showScreen('screen-dashboard');
    }
  } else {
    document.getElementById('pin-error').textContent = '❌ 비밀번호가 틀렸어요';
    pinBuffer = '';
    updatePinDots();
  }
}

function renderDashboard() {
  const s = loadSettings();
  const tasks = loadTasks();
  const log = loadTodayLog();
  const photos = loadPendingPhotos();
  const redeems = loadRedeems();

  // Children cards
  const childrenEl = document.getElementById('dashboard-children');
  childrenEl.innerHTML = '<div class="section-title">오늘의 진행 상황</div>';
  s.children.forEach(child => {
    const allTasks = tasks.filter(t => t.enabled);
    const childLog = log[child.id] || {};
    const done = allTasks.filter(t => childLog[t.id]).length;
    const pct = allTasks.length > 0 ? Math.round((done/allTasks.length)*100) : 0;
    const todayXp = allTasks.filter(t => childLog[t.id]).reduce((sum, t) => sum + (childLog[t.id].xp||0), 0);
    const card = document.createElement('div');
    card.className = 'card card-sm';
    card.style.marginBottom = '10px';
    card.innerHTML = `
      <div class="row-between" style="margin-bottom:10px;">
        <div class="row">
          <span style="font-size:2rem;">${getCharEmoji(child.characterType, child.level)}</span>
          <div>
            <div class="fw-bold">${esc(child.name)}</div>
            <div class="body-xs text-muted">LV.${child.level} · 💎 ${child.points}</div>
          </div>
        </div>
        <div class="badge badge-accent">오늘 +${todayXp}XP</div>
      </div>
      <div class="row-between" style="margin-bottom:6px;">
        <span class="body-sm text-muted">진행률 ${done}/${allTasks.length}</span>
        <span class="body-sm fw-bold">${pct}%</span>
      </div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" style="width:${pct}%; background:linear-gradient(90deg, #10b981, #34d399);"></div>
      </div>
    `;
    childrenEl.appendChild(card);
  });

  // Pending photos
  const photosEl = document.getElementById('dashboard-photos');
  const pendingPhotos = photos.filter(p => !p.approved && !p.rejected);
  if (pendingPhotos.length > 0) {
    photosEl.innerHTML = `<div class="section-title">📸 사진 승인 대기 (${pendingPhotos.length})</div>`;
    pendingPhotos.forEach(photo => {
      const card = document.createElement('div');
      card.className = 'card card-sm';
      card.style.marginBottom = '10px';
      const child = s.children.find(c => c.id === photo.childId);
      card.innerHTML = `
        <div class="row-between" style="margin-bottom:10px;">
          <div class="row">
            <span style="font-size:1.5rem;">${photo.taskIcon}</span>
            <div>
              <div class="fw-bold">${esc(photo.taskName)}</div>
              <div class="body-xs text-muted">${child ? esc(child.name) : ''} · +${photo.taskXp}XP</div>
            </div>
          </div>
        </div>
        <img class="photo-thumb" src="${photo.photo}" alt="사진" style="margin-bottom:10px;">
        <div style="display:flex; gap:8px;">
          <button class="btn btn-success btn-sm" style="flex:1;" onclick="approvePhoto('${photo.id}')">✅ 승인</button>
          <button class="btn btn-danger btn-sm" style="flex:1;" onclick="rejectPhoto('${photo.id}')">❌ 다시</button>
        </div>
      `;
      photosEl.appendChild(card);
    });
  } else {
    photosEl.innerHTML = '';
  }

  // Redemption requests
  const redeemsEl = document.getElementById('dashboard-redeems');
  const pendingRedeems = redeems.filter(r => !r.acknowledged);
  if (pendingRedeems.length > 0) {
    redeemsEl.innerHTML = `<div class="section-title">🎁 보상 교환 요청 (${pendingRedeems.length})</div>`;
    pendingRedeems.forEach(rd => {
      const card = document.createElement('div');
      card.className = 'card card-sm';
      card.style.marginBottom = '10px';
      card.innerHTML = `
        <div class="row-between">
          <div class="row">
            <span style="font-size:1.8rem;">${rd.rewardIcon}</span>
            <div>
              <div class="fw-bold">${esc(rd.rewardName)}</div>
              <div class="body-xs text-muted">${esc(rd.childName)} · 💎 ${rd.cost}</div>
            </div>
          </div>
          <button class="btn btn-sm btn-ghost" onclick="ackRedeem('${rd.id}')">확인 ✓</button>
        </div>
      `;
      redeemsEl.appendChild(card);
    });

  }
}

function approvePhoto(photoId) {
  const photos = loadPendingPhotos();
  const photo = photos.find(p => p.id === photoId);
  if (!photo) return;
  photo.approved = true;
  savePendingPhotos(photos);
  // Give XP
  const child = getChild(photo.childId);
  if (child) {
    const prevChildId = state.currentChildId;
    state.currentChildId = photo.childId;
    const log = loadTodayLog();
    if (!log[child.id]) log[child.id] = {};
    log[child.id][photo.taskId] = { completedAt: Date.now(), xp: photo.taskXp, photoApproved: true };
    saveTodayLog(log);
    // Apply XP
    const s = loadSettings();
    const xpPerLevel = s.xpPerLevel || 100;
    const oldLevel = child.level;
    child.xp += photo.taskXp;
    while (child.xp >= xpPerLevel) {
      child.xp -= xpPerLevel;
      child.level += 1;
      let pts = s.pointsPerLevel || 20;
      if (child.level % (s.milestoneInterval || 5) === 0) pts += (s.milestoneBonus || 50);
      child.points += pts;
    }
    saveChild(child);
    state.currentChildId = prevChildId;
  }
  showMsg('✅', '승인 완료! 아이에게 XP가 지급됐어요.');
  renderDashboard();
}

function rejectPhoto(photoId) {
  const photos = loadPendingPhotos();
  const idx = photos.findIndex(p => p.id === photoId);
  if (idx >= 0) { photos[idx].rejected = true; savePendingPhotos(photos); }
  showMsg('❌', '사진이 거절됐어요. 다시 찍어보라고 알려주세요.');
  renderDashboard();
}

function ackRedeem(redeemId) {
  const redeems = loadRedeems();
  const rd = redeems.find(r => r.id === redeemId);
  if (rd) { rd.acknowledged = true; saveRedeems(redeems); }
  renderDashboard();
}

}
function tabLabel(tab) {
  const m = {children:'아이',quests:'퀘스트',rewards:'보상',points:'포인트',other:'기타'};
  return m[tab] || tab;
}

function renderSettingsTab(tab) {
  const content = document.getElementById('settings-content');
  if (tab === 'children') renderSettingsChildren(content);
  else if (tab === 'quests') renderSettingsQuests(content);
  else if (tab === 'rewards') renderSettingsRewards(content);
  else if (tab === 'points') renderSettingsPoints(content);
  else if (tab === 'other') renderSettingsOther(content);
}

function renderSettingsChildren(el) {
  const s = loadSettings();
  el.innerHTML = '';
  s.children.forEach(child => {
    const card = document.createElement('div');
    card.className = 'card card-sm';
    card.style.marginBottom = '12px';
    card.innerHTML = `
      <div class="row-between" style="margin-bottom:12px;">
        <div class="row">
          <span style="font-size:2rem;">${getCharEmoji(child.characterType, child.level)}</span>
          <div>
            <div class="fw-bold">${esc(child.name)}</div>
            <div class="body-xs text-muted">LV.${child.level} · ${getCharStageName(child.characterType, child.level)}</div>
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="editChild('${child.id}')">✏️ 수정</button>
      </div>
    `;
    el.appendChild(card);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-ghost btn-full';
  addBtn.textContent = '+ 아이 추가';
  addBtn.onclick = () => addChild();
  el.appendChild(addBtn);
}

function editChild(childId) {
  const s = loadSettings();
  const child = s.children.find(c => c.id === childId);
  if (!child) return;
  const content = document.getElementById('settings-content');
  content.innerHTML = `
    <div class="card card-sm">
      <div class="row" style="margin-bottom:16px;">
        <button class="back-btn" onclick="renderSettingsTab('children')" style="font-size:1.1rem;">◀</button>
        <span class="title-md">아이 정보 수정</span>
      </div>
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="edit-child-name" value="${esc(child.name)}" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label>캐릭터 선택</label>
        <div class="emoji-picker" id="edit-char-picker">
          ${CHAR_TYPES.map(ct => `
            <div class="emoji-opt ${child.characterType===ct?'selected':''}" onclick="selectCharType('${childId}','${ct}')" title="${CHARACTERS[ct].name}">
              ${getCharEmoji(ct, child.level)}
            </div>
          `).join('')}
        </div>
        <div class="body-xs text-muted" style="margin-top:6px;">선택된 캐릭터: <span id="edit-char-name">${CHARACTERS[child.characterType].name}</span></div>
      </div>
      <div class="form-group">
        <label>현재 레벨: <span id="edit-level-val">${child.level}</span></label>
        <input type="range" min="1" max="30" value="${child.level}" id="edit-level-range" oninput="document.getElementById('edit-level-val').textContent=this.value">
      </div>
      <button class="btn btn-primary btn-full" onclick="saveChildEdit('${childId}')">저장</button>
      <div class="spacer-sm"></div>
      <button class="btn btn-danger btn-full" style="opacity:0.7;" onclick="deleteChild('${childId}')">아이 삭제</button>
    </div>
  `;
  state.editingChildId = childId;
  state.editingCharType = child.characterType;
}

function selectCharType(childId, ct) {
  state.editingCharType = ct;
  document.querySelectorAll('#edit-char-picker .emoji-opt').forEach((el, i) => {
    el.classList.toggle('selected', CHAR_TYPES[i] === ct);
  });
  const lvl = parseInt(document.getElementById('edit-level-range').value)||1;
  document.querySelectorAll('#edit-char-picker .emoji-opt').forEach((el, i) => {
    el.textContent = getCharEmoji(CHAR_TYPES[i], lvl);
  });
  if (document.getElementById('edit-char-name')) document.getElementById('edit-char-name').textContent = CHARACTERS[ct].name;
}

function saveChildEdit(childId) {
  const s = loadSettings();
  const child = s.children.find(c => c.id === childId);
  if (!child) return;
  const name = document.getElementById('edit-child-name').value.trim();
  if (!name) { showMsg('⚠️','이름을 입력해주세요'); return; }
  const newLevel = parseInt(document.getElementById('edit-level-range').value)||1;
  child.name = name;
  child.characterType = state.editingCharType || child.characterType;
  child.level = newLevel;
  saveSettings(s);
  showMsg('✅', '저장됐어요!');
  setTimeout(() => renderSettingsTab('children'), 300);
}

function deleteChild(childId) {
  const s = loadSettings();
  if (s.children.length <= 1) { showMsg('⚠️','최소 한 명의 아이가 필요해요'); return; }
  s.children = s.children.filter(c => c.id !== childId);
  saveSettings(s);
  renderSettingsTab('children');
}

function addChild() {
  const s = loadSettings();
  const newId = 'c_' + Date.now();
  s.children.push({ id: newId, name: '새 아이', characterType: 'dragon', level: 1, xp: 0, points: 0, color: '#7c3aed' });
  saveSettings(s);
  editChild(newId);
}

function renderSettingsQuests(el) {
  const tasks = loadTasks();
  el.innerHTML = '';
  const slots = ['morning','afterschool','evening'];
  const slotNames = { morning:'🌅 아침', afterschool:'🏫 하교 후', evening:'🌙 저녁' };
  slots.forEach(slot => {
    const header = document.createElement('div');
    header.className = 'section-title';
    header.style.marginTop = '8px';
    header.textContent = slotNames[slot];
    el.appendChild(header);
    tasks.filter(t => t.slot === slot).forEach(task => {
      const row = document.createElement('div');
      row.className = 'card card-tight';
      row.style.marginBottom = '8px';
      row.innerHTML = `
        <div class="row-between" style="margin-bottom:6px;">
          <div class="row" style="gap:8px;">
            <span style="font-size:1.4rem;">${task.icon}</span>
            <span class="fw-bold body-md">${esc(task.name)}</span>
          </div>
          <div class="toggle ${task.enabled?'on':''}" onclick="toggleTask('${task.id}')"></div>
        </div>
        <div class="row-between">
          <span class="body-xs text-muted">${task.needsPhoto?'📸 사진 필요':'✅ 사진 불필요'}</span>
          <div class="row" style="gap:6px;">
            <span class="badge badge-accent">${task.xp}XP</span>
            <button class="btn btn-sm btn-ghost" style="padding:4px 10px;font-size:0.75rem;" onclick="editTask('${task.id}')">수정</button>
          </div>
        </div>
      `;
      el.appendChild(row);
    });
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-ghost btn-full';
  addBtn.style.marginTop = '8px';
  addBtn.textContent = '+ 퀘스트 추가';
  addBtn.onclick = addTask;
  el.appendChild(addBtn);
}

function toggleTask(taskId) {
  const tasks = loadTasks();
  const t = tasks.find(x => x.id === taskId);
  if (t) t.enabled = !t.enabled;
  saveTasks(tasks);
  renderSettingsTab('quests');
}

function editTask(taskId) {
  const tasks = loadTasks();
  const task = tasks.find(t => t.id === taskId) || { id: 'new_'+Date.now(), name:'', icon:'⭐', xp:20, slot:'morning', needsPhoto:false, enabled:true, tip:'' };
  const content = document.getElementById('settings-content');
  content.innerHTML = `
    <div class="card card-sm">
      <div class="row" style="margin-bottom:16px;">
        <button class="back-btn" onclick="renderSettingsTab('quests')" style="font-size:1.1rem;">◀</button>
        <span class="title-md">퀘스트 수정</span>
      </div>
      <div class="form-group"><label>이름</label><input type="text" id="et-name" value="${esc(task.name)}" placeholder="퀘스트 이름"></div>
      <div class="form-group"><label>아이콘 (이모지)</label><input type="text" id="et-icon" value="${task.icon}" maxlength="4" style="font-size:1.5rem;"></div>
      <div class="form-group"><label>XP</label><input type="number" id="et-xp" value="${task.xp}" min="5" max="200"></div>
      <div class="form-group"><label>시간대</label>
        <select id="et-slot">
          <option value="morning" ${task.slot==='morning'?'selected':''}>아침</option>
          <option value="afterschool" ${task.slot==='afterschool'?'selected':''}>하교 후</option>
          <option value="evening" ${task.slot==='evening'?'selected':''}>저녁</option>
        </select>
      </div>
      <div class="form-group"><label>팁 메시지</label><input type="text" id="et-tip" value="${esc(task.tip||'')}" placeholder="격려 메시지"></div>
      <div class="toggle-row">
        <span>사진 필요</span>
        <div class="toggle ${task.needsPhoto?'on':''}" id="et-photo-toggle" onclick="this.classList.toggle('on')"></div>
      </div>
      <div class="spacer-sm"></div>
      <button class="btn btn-primary btn-full" onclick="saveTaskEdit('${task.id}')">저장</button>
      ${taskId !== task.id ? '' : `<div class="spacer-sm"></div><button class="btn btn-danger btn-full" style="opacity:0.7;" onclick="deleteTask('${task.id}')">삭제</button>`}
    </div>
  `;
}

function saveTaskEdit(taskId) {
  const tasks = loadTasks();
  let task = tasks.find(t => t.id === taskId);
  const isNew = !task;
  if (!task) { task = { id: taskId, enabled: true }; tasks.push(task); }
  task.name = document.getElementById('et-name').value.trim() || task.name;
  task.icon = document.getElementById('et-icon').value.trim() || task.icon;
  task.xp = parseInt(document.getElementById('et-xp').value)||20;
  task.slot = document.getElementById('et-slot').value;
  task.tip = document.getElementById('et-tip').value.trim();
  task.needsPhoto = document.getElementById('et-photo-toggle').classList.contains('on');
  saveTasks(tasks);
  showMsg('✅', '저장됐어요!');
  setTimeout(() => renderSettingsTab('quests'), 300);
}

function deleteTask(taskId) {
  const tasks = loadTasks();
  saveTasks(tasks.filter(t => t.id !== taskId));
  renderSettingsTab('quests');
}

function addTask() {
  editTask('new_'+Date.now());
}

function renderSettingsRewards(el) {
  const rewards = loadRewards();
  el.innerHTML = '';
  rewards.forEach(r => {
    const row = document.createElement('div');
    row.className = 'card card-tight';
    row.style.marginBottom = '8px';
    row.innerHTML = `
      <div class="row-between">
        <div class="row">
          <span style="font-size:1.8rem;">${r.icon}</span>
          <div>
            <div class="fw-bold body-md">${esc(r.name)}</div>
            <div class="body-xs text-diamond">💎 ${r.cost}</div>
          </div>
        </div>
        <div class="row">
          <button class="btn btn-sm btn-ghost" style="padding:4px 10px;font-size:0.75rem;" onclick="editReward('${r.id}')">수정</button>
          <button class="btn btn-sm btn-danger" style="padding:4px 10px;font-size:0.75rem;" onclick="deleteReward('${r.id}')">삭제</button>
        </div>
      </div>
    `;
    el.appendChild(row);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-accent btn-full';
  addBtn.style.marginTop = '8px';
  addBtn.textContent = '+ 보상 추가';
  addBtn.onclick = () => editReward('new_'+Date.now());
  el.appendChild(addBtn);
}

function editReward(rewardId) {
  const rewards = loadRewards();
  const r = rewards.find(x => x.id === rewardId) || { id: rewardId, name:'', icon:'🎁', cost:100 };
  const content = document.getElementById('settings-content');
  content.innerHTML = `
    <div class="card card-sm">
      <div class="row" style="margin-bottom:16px;">
        <button class="back-btn" onclick="renderSettingsTab('rewards')" style="font-size:1.1rem;">◀</button>
        <span class="title-md">보상 수정</span>
      </div>
      <div class="form-group"><label>이름</label><input type="text" id="er-name" value="${esc(r.name)}" placeholder="보상 이름"></div>
      <div class="form-group"><label>아이콘 (이모지)</label><input type="text" id="er-icon" value="${r.icon}" maxlength="4" style="font-size:1.5rem;"></div>
      <div class="form-group"><label>포인트 비용 (💎)</label><input type="number" id="er-cost" value="${r.cost}" min="1"></div>
      <button class="btn btn-primary btn-full" onclick="saveRewardEdit('${r.id}')">저장</button>
    </div>
  `;
}

function saveRewardEdit(rewardId) {
  const rewards = loadRewards();
  let r = rewards.find(x => x.id === rewardId);
  if (!r) { r = { id: rewardId }; rewards.push(r); }
  r.name = document.getElementById('er-name').value.trim() || r.name;
  r.icon = document.getElementById('er-icon').value.trim() || r.icon;
  r.cost = parseInt(document.getElementById('er-cost').value)||100;
  saveRewards(rewards);
  showMsg('✅', '저장됐어요!');
  setTimeout(() => renderSettingsTab('rewards'), 300);
}

function deleteReward(rewardId) {
  saveRewards(loadRewards().filter(r => r.id !== rewardId));
  renderSettingsTab('rewards');
}

function renderSettingsPoints(el) {
  const s = loadSettings();
  el.innerHTML = '';
  s.children.forEach(child => {
    const card = document.createElement('div');
    card.className = 'card card-sm';
    card.style.marginBottom = '12px';
    card.innerHTML = `
      <div class="row" style="margin-bottom:12px;">
        <span style="font-size:1.8rem;">${getCharEmoji(child.characterType, child.level)}</span>
        <div class="fw-bold">${esc(child.name)}</div>
        <div class="badge badge-diamond" style="margin-left:auto;">💎 ${child.points}</div>
      </div>
      <div class="row" style="gap:8px;">
        <input type="number" id="pts-${child.id}" placeholder="포인트 수" min="1" style="flex:1;">
        <button class="btn btn-success btn-sm" onclick="adjustPoints('${child.id}',1)">+추가</button>
        <button class="btn btn-danger btn-sm" onclick="adjustPoints('${child.id}',-1)">-차감</button>
      </div>
    `;
    el.appendChild(card);
  });
}

function adjustPoints(childId, dir) {
  const child = getChild(childId);
  if (!child) return;
  const val = parseInt(document.getElementById('pts-'+childId).value)||0;
  if (val <= 0) { showMsg('⚠️', '포인트를 입력해주세요'); return; }
  child.points = Math.max(0, child.points + dir * val);
  saveChild(child);
  showMsg(dir > 0 ? '💎' : '➖', `${esc(child.name)}의 포인트가 ${dir>0?'추가':'차감'}됐어요!\n현재: 💎 ${child.points}`);
  setTimeout(() => renderSettingsTab('points'), 300);
}

function renderSettingsOther(el) {
  const s = loadSettings();
  el.innerHTML = `
    <div class="card card-sm" style="margin-bottom:12px;">
      <div class="section-title">태권도 출발 시간</div>
      <div class="form-group">
        <label>출발 시간 (2시간 전부터 알림)</label>
        <input type="text" id="set-taekwondo" value="${s.taekwondoTime||''}" placeholder="예: 14:25">
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveTaekwondo()">저장</button>
    </div>
    <div class="card card-sm" style="margin-bottom:12px;">
      <div class="section-title">비밀번호 변경</div>
      <div class="form-group">
        <label>새 비밀번호 (4자리)</label>
        <input type="password" id="set-pin" maxlength="4" placeholder="0000" inputmode="numeric">
      </div>
      <button class="btn btn-primary btn-sm" onclick="savePin()">변경</button>
    </div>
    <div class="card card-sm" style="margin-bottom:12px;">
      <div class="section-title">XP 설정</div>
      <div class="form-group">
        <label>레벨당 필요 XP: <span id="xp-level-val">${s.xpPerLevel||100}</span></label>
        <input type="range" min="50" max="500" step="10" value="${s.xpPerLevel||100}" oninput="document.getElementById('xp-level-val').textContent=this.value" id="set-xp-level">
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveXpSettings()">저장</button>
    </div>
    <div class="card card-sm" style="margin-bottom:12px;">
      <div class="section-title">⚠️ 데이터 초기화</div>
      <div class="body-sm text-muted" style="margin-bottom:12px;">오늘의 퀘스트 기록을 초기화합니다</div>
      <button class="btn btn-danger btn-sm" onclick="resetToday()">오늘 기록 초기화</button>
    </div>
  `;
}

function saveTaekwondo() {
  const s = loadSettings();
  s.taekwondoTime = document.getElementById('set-taekwondo').value.trim();
  saveSettings(s);
  showMsg('✅', '저장됐어요!');
}

function savePin() {
  const pin = document.getElementById('set-pin').value.trim();
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { showMsg('⚠️', '4자리 숫자를 입력해주세요'); return; }
  const s = loadSettings();
  s.parentPin = pin;
  saveSettings(s);
  showMsg('✅', '비밀번호가 변경됐어요!');
}

function saveXpSettings() {
  const s = loadSettings();
  s.xpPerLevel = parseInt(document.getElementById('set-xp-level').value)||100;
  saveSettings(s);
  showMsg('✅', '저장됐어요!');
}

function resetToday() {
  try { localStorage.removeItem(todayKey()); } catch(e) {}
  showMsg('✅', '오늘 기록이 초기화됐어요!');
}

// ================================================================
// UTILITY
// ================================================================
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ================================================================
// INIT
// ================================================================
function init() {
  // Ensure default data exists
  const s = loadSettings();
  if (!s.children || s.children.length === 0) {
    saveSettings(DEFAULT_SETTINGS);
  }
  if (!localStorage.getItem('quest_tasks')) {
    saveTasks(DEFAULT_TASKS);
  }
  if (!localStorage.getItem('quest_rewards')) {
    saveRewards(DEFAULT_REWARDS);
  }
  renderWelcome();
  // Update taekwondo every minute
  setInterval(() => {
    if (document.getElementById('screen-home').classList.contains('active')) {
      const s2 = loadSettings();
      checkTaekwondo(s2);
    }
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
